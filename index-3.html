function admin(){const a=$('#adm');
 if(!U){a.innerHTML=`<div class="fm lg"><h2 style="font:400 34px 'Bebas Neue',sans-serif;letter-spacing:1px;color:var(--g)">Painel ${H(NM())}</h2><label>Senha de acesso</label><input id="pw" type="password" ${E(function(event){if(event.key=='Enter')login()},'keydown')}><button class="btn" ${E(function(){login()})}>Entrar</button><p style="margin-top:14px;text-align:center"><button class="va" ${E(vl)}>← Voltar à loja</button></p></div>`;return}
 const TB=[['p','Produtos'],['c','Categorias'],['b','Banners'],['m','Promoções'],['a','Adicionais'],['r','Relatórios'],['s','Loja']];
 a.innerHTML=`<div class="ah">Painel ${H(NM())}<span><button class="va" ${E(vl)}>Ver loja</button> <button class="va" ${E(function(){U=false;TK='';PW='';admin()})}>Sair</button></span></div><div class="tabs">${TB.map(([k,t])=>`<button class="${A.t==k?'on':''}" ${E(function(){A.t=k;A.e=A.b=null;admin()})}>${t}</button>`).join('')}</div><div class="ab">${({p:()=>A.e?pform():plist(),c:clist,b:()=>A.b?bform():blist(),m:mlist,a:alist,r:rlist,s:sform})[A.t]()}</div>`}
/* produtos */
const newp=()=>({id:nid('p'),n:'',c:D.cats[0]?.id||'',p:0,pp:0,d:'',ph:[],ad:D.ads.map(a=>a.id),est:null,st:1,fl:{mv:0}});
function ped(id){A.e=JSON.parse(JSON.stringify(D.prods.find(x=>x.id==id)));admin()}
const plist=()=>`<button class="btn" ${E(function(){A.e=newp();admin()})}>+ Novo produto</button>${D.prods.map(p=>`<div class="row"><div class="rt" ${p.ph[0]?`style="background-image:url(${RES(p.ph[0])})"`:''}></div><div class="rb"><b>${H(p.n)}</b><small>${H(catn(p.c))} · ${R(cur(p))} · ${esg(p)?'ESGOTADO':p.est==null?'sem controle de estoque':'estoque '+p.est}${p.st?'':' · inativo'}</small></div><button class="va" ${E(function(){ped(p.id)})}>Editar</button><button class="va x" ${E(function(){del('p',p.id)})}>Excluir</button></div>`).join('')||'<p class="em">Nenhum produto cadastrado.</p>'}`;
const pform=()=>{const e=A.e;return `<div class="fm"><h3>${e.n?'Editar':'Novo'} produto</h3><label>Nome</label><input id="fn" value="${H(e.n)}"><label>Categoria</label><select id="fc">${D.cats.map(c=>`<option value="${c.id}" ${c.id==e.c?'selected':''}>${H(c.n)}</option>`).join('')}</select><label>Preço (R$)</label><input id="fp" type="number" step=".01" inputmode="decimal" value="${e.p||''}"><label>Preço promocional (opcional)</label><input id="fq" type="number" step=".01" inputmode="decimal" value="${e.pp||''}"><label>Descrição curta</label><textarea id="fd" rows="3">${H(e.d)}</textarea><label>Estoque (quantidade; vazio = sem controle; 0 = esgotado)</label><input id="fe" type="number" inputmode="numeric" value="${e.est==null?'':e.est}"><label>Status</label><select id="ft"><option value="1">Ativo</option><option value="0" ${e.st?'':'selected'}>Inativo</option></select><label class="ck"><input type="checkbox" id="k3" ${e.fl.mv?'checked':''}>Mais vendido</label><label>Adicionais deste produto</label>${D.ads.map(a=>`<label class="ck"><input type="checkbox" name="ad" value="${a.id}" ${e.ad.includes(a.id)?'checked':''}>${H(a.n)} (+${R(a.p)})</label>`).join('')||'<p class="mut">Nenhum adicional ainda. Crie um abaixo.</p>'}<div class="row" style="margin-top:8px"><input id="xan" placeholder="Novo adicional (ex: Molho Verde)"><input id="xap" type="number" step=".01" inputmode="decimal" placeholder="R$" style="max-width:80px"><button class="va" ${E(nadd)}>+ Criar</button></div><div style="margin-top:8px"><button class="va" ${E(function(){allad(1)})}>Marcar todos</button> <button class="va" ${E(function(){allad(0)})}>Limpar</button></div><label>Fotos (a primeira é a capa)</label>${e.ph.map((u,i)=>`<div class="pt" style="background-image:url(${RES(u)})"><button ${E(function(){grab();A.e.ph.splice(i,1);admin()})}>✕</button></div>`).join('')}<input type="file" accept="image/*" multiple ${E(function(){addPh(this)},'change')}><button class="btn" ${E(psave)}>Salvar produto</button><button class="btn gh" ${E(function(){A.e=null;admin()})}>Cancelar</button></div>`};
function grab(){const e=A.e,v=i=>$('#'+i).value;e.n=v('fn');e.c=v('fc');e.p=parseFloat(v('fp'))||0;e.pp=parseFloat(v('fq'))||0;e.d=v('fd');const s=v('fe').trim();e.est=s===''?null:Math.max(0,parseInt(s)||0);e.st=+v('ft');e.fl={mv:+$('#k3').checked};e.ad=[...document.querySelectorAll('#adm input[name=ad]:checked')].map(x=>x.value)}
function nadd(){const n=$('#xan').value.trim(),p=parseFloat($('#xap').value)||0;if(!n)return toast('Digite o nome do adicional');grab();const id=nid('a');D.ads.push({id,n,p});A.e.ad.push(id);admin();toast('Adicional criado. Toque em Salvar produto para gravar.')}
function allad(v){grab();A.e.ad=v?D.ads.map(a=>a.id):[];admin()}
function addPh(i){grab();[...i.files].forEach(f=>img(f,800,async u=>{const p=await up(u);if(p){A.e.ph.push(p);admin()}}))}
function psave(){grab();const e=A.e;if(!e.n.trim()||!e.p)return toast('Informe nome e preço');const q=JSON.parse(JSON.stringify(e));q.ad=q.ad.filter(id=>D.ads.some(a=>a.id==id));const i=D.prods.findIndex(x=>x.id==q.id);i<0?D.prods.unshift(q):D.prods[i]=q;save(()=>A.e=null)}
/* promoções */
const mlist=()=>`<div class="fm"><label>Criar promoção: escolha o produto</label><select id="mp">${D.prods.map(p=>`<option value="${p.id}">${H(p.n)} (${R(p.p)})</option>`).join('')}</select><label>Preço promocional (R$)</label><input id="mv" type="number" step=".01" inputmode="decimal"><button class="btn" ${E(function(){mset()})}>Criar promoção</button></div><h4>Promoções ativas</h4>${D.prods.filter(p=>p.pp>0).map(p=>`<div class="row"><div class="rb"><b>${H(p.n)}</b><small>de ${R(p.p)} por</small></div><input id="pp_${p.id}" type="number" step=".01" value="${p.pp}" style="max-width:95px"><button class="va" ${E(function(){mset(p.id)})}>Salvar</button><button class="va x" ${E(function(){del('m',p.id)})}>Excluir</button></div>`).join('')||'<p class="em">Nenhuma promoção ativa.</p>'}`;
function mset(id){const p=D.prods.find(x=>x.id==(id||$('#mp').value)),v=parseFloat($(id?'#pp_'+id:'#mv').value)||0;if(!p||v<=0||v>=p.p)return toast('O preço promocional precisa ser menor que '+(p?R(p.p):'o preço'));p.pp=v;save()}
/* adicionais */
const alist=()=>`<div class="row"><input id="an" placeholder="Novo adicional"><input id="ap" type="number" step=".01" inputmode="decimal" placeholder="R$" style="max-width:90px"><button class="va" ${E(function(){asv()})}>Adicionar</button></div>${D.ads.map(a=>`<div class="row"><input id="an_${a.id}" value="${H(a.n)}"><input id="ap_${a.id}" type="number" step=".01" value="${a.p}" style="max-width:90px"><button class="va" ${E(function(){asv(a.id)})}>Salvar</button><button class="va x" ${E(function(){del('a',a.id)})}>Excluir</button></div>`).join('')}<p class="ins" style="margin-top:10px">Depois de criar um adicional, marque em quais produtos ele aparece, na edição do produto.</p>`;
function asv(id){const n=$(id?'#an_'+id:'#an').value.trim(),p=parseFloat($(id?'#ap_'+id:'#ap').value)||0;if(!n)return;if(id){const a=D.ads.find(x=>x.id==id);a.n=n;a.p=p}else D.ads.push({id:nid('a'),n,p});save()}
/* relatórios */
const rlist=()=>{const sem=D.prods.filter(esg),mv=D.prods.filter(p=>p.fl.mv),li=(l,t)=>l.length?l.map(p=>`<div class="row"><div class="rb"><b>${H(p.n)}</b><small>${H(catn(p.c))} · ${R(cur(p))}</small></div></div>`).join(''):`<p class="mut">${t}</p>`;
 return `<div class="kp"><div><b>${D.prods.length}</b><span>Produtos cadastrados</span></div><div><b>${sem.length}</b><span>Sem estoque</span></div><div><b>${D.prods.filter(p=>p.pp>0).length}</b><span>Em promoção</span></div><div><b>${D.cats.length}</b><span>Categorias</span></div></div><h4>Mais vendidos (os que você marcou)</h4>${li(mv,'Nenhum marcado. Marque no cadastro do produto.')}<h4>Produtos sem estoque</h4>${li(sem,'Nenhum produto esgotado.')}<div class="inf"><b>Pedidos pelo WhatsApp</b><span>Eles chegam direto no WhatsApp da loja, com tudo detalhado. A contagem automática de pedidos e dos itens mais vendidos precisa de um banco de dados online (como o Supabase), que este site não usa.</span></div>`};
const clist=()=>`<div class="row"><input id="nc" placeholder="Nova categoria"><button class="va" ${E(function(event){csv()})}>Adicionar</button></div>${D.cats.map(c=>`<div class="row"><input id="c_${c.id}" value="${H(c.n)}"><button class="va" ${E(function(event){csv(c.id)})}>Salvar</button><button class="va x" ${E(function(event){del('c',c.id)})}>Excluir</button></div>`).join('')}`;
function csv(id){const v=$(id?'#c_'+id:'#nc').value.trim();if(!v)return;id?D.cats.find(c=>c.id==id).n=v:D.cats.push({id:nid('c'),n:v});save()}
const RTS=()=>[['s/all','Cardápio completo'],['s/mv','Mais Vendidos'],['s/pm','Promoções'],...D.cats.map(c=>['c/'+c.id,c.n])];
const blist=()=>`<button class="btn" ${E(function(){A.b={id:nid('b'),t:'',s:'',bb:'Peça Agora',img:'',cat:'s/all'};admin()})}>+ Novo banner</button>${D.bans.map(b=>`<div class="row"><div class="rt" ${b.img?`style="background-image:url(${RES(b.img)})"`:''}></div><div class="rb"><b>${H(b.t||'(sem título)')}</b><small>${H(b.s)}</small></div><button class="va" ${E(function(){A.b=JSON.parse(JSON.stringify(b));admin()})}>Editar</button><button class="va x" ${E(function(){del('b',b.id)})}>Excluir</button></div>`).join('')}`;
const gb=()=>{const b=A.b;b.t=$('#bt').value;b.s=$('#bs').value;b.bb=$('#bb').value;b.cat=$('#bk').value};
const bform=()=>{const b=A.b;return `<div class="fm"><h3>Banner</h3><label>Título</label><input id="bt" value="${H(b.t)}"><label>Subtítulo</label><input id="bs" value="${H(b.s)}"><label>Texto do botão (vazio = sem botão)</label><input id="bb" value="${H(b.bb)}"><label>Ao tocar no banner, abrir</label><select id="bk"><option value="">Nada</option>${RTS().map(([v,t])=>`<option value="${v}" ${v==b.cat?'selected':''}>${H(t)}</option>`).join('')}</select><label>Imagem (formato 16:9; sem imagem usa o fundo vermelho)</label>${b.img?`<div class="pt" style="width:160px;height:90px;background-image:url(${RES(b.img)})"><button ${E(function(){gb();A.b.img='';admin()})}>✕</button></div>`:''}<input type="file" accept="image/*" ${E(function(){gb();img(this.files[0],1200,async u=>{const p=await up(u);if(p){A.b.img=p;admin()}})},'change')}><button class="btn" ${E(bsv)}>Salvar banner</button><button class="btn gh" ${E(function(){A.b=null;admin()})}>Cancelar</button></div>`};
function bsv(){gb();const i=D.bans.findIndex(x=>x.id==A.b.id);i<0?D.bans.push(A.b):D.bans[i]=A.b;save(()=>A.b=null)}
const F=[['nome','Nome da loja'],['wa','WhatsApp da loja (com DDI e DDD, ex: 5591999999999)'],['desc','Descrição da loja (rodapé e Google)'],['addr','Endereço'],['h1','Horário de funcionamento (linha 1)'],['h2','Horário de funcionamento (linha 2)'],['taxa','Taxa de entrega (R$; 0 = grátis)'],['min','Valor mínimo do pedido (R$; 0 = sem mínimo)'],['fr','Frases promocionais da faixa vermelha (separe com |)']];
const sform=()=>`<div class="fm">${TK&&!NEEDTK?'':`<div class="inf"><b>Ativar salvamento (só 1ª vez)</b><span>Cole o token do GitHub abaixo. Depois disso, este aviso some e qualquer aparelho edita só com a senha.<br>Este site usa o repositório <b>${(GH()||['?']).join('/')}</b>: o token precisa ser desse repositório.</span></div><input id="tk" type="password" placeholder="github_pat_..." style="margin-top:10px"><button class="btn" ${E(conn)}>Ativar salvamento</button><div id="dg" style="margin-top:10px;font-size:12px;color:var(--mut);word-break:break-word"></div>`}<label>Logo (opcional; sem logo aparece o nome em letras)</label>${D.cfg.logo?`<div class="pt" style="width:120px;height:60px;background-color:#fff;background-size:contain;background-repeat:no-repeat;background-image:url(${RES(D.cfg.logo)})"><button ${E(function(){gc();D.cfg.logo='';admin()})}>✕</button></div>`:''}<input type="file" accept="image/*" ${E(function(){gc();img(this.files[0],500,async u=>{const p=await up(u);if(p){D.cfg.logo=p;admin()}})},'change')}>${F.map(([k,t])=>`<label>${t}</label><input id="s_${k}" value="${H(D.cfg[k])}">`).join('')}<button class="btn" ${E(function(event){ssv()})}>Salvar configurações</button></div>`;
const gc=()=>{F.forEach(([k])=>{const e=$('#s_'+k);if(e){const v=e.value.trim();D.cfg[k]=['taxa','min'].includes(k)?(parseFloat(v.replace(',','.'))||0):(k=='nome'&&!v?'CJ Lanches':v)}})};
function ssv(){gc();save()}
addEventListener('hashchange',()=>{go();scrollTo(0,0)});(async()=>{SNAP=JSON.stringify(D);try{const r=await Promise.race([fetch('dados.json?t='+Date.now()),new Promise((_,j)=>setTimeout(j,4000))]);if(r.ok){const d=await r.json();if(d&&d.prods){D=d;SNAP=JSON.stringify(D)}}}catch(e){}norm();SNAP=JSON.stringify(D);init()})();
</script></body></html>
